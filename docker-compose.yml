# Ambiente local: Postgres 16 + MinIO (storage S3 compatível).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/sql/init-local.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: foccus
      MINIO_ROOT_PASSWORD: foccus-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
volumes:
  pgdata: {}
  minio: {}
